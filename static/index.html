<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interview Prep</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0b0e14] text-slate-100 min-h-screen flex flex-col font-sans antialiased">

    <!-- Header -->
    <header class="border-b border-slate-800/80 bg-[#0d1117]/50 backdrop-blur-md px-8 py-4">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600/20 border border-indigo-500/30 text-indigo-400 p-2 rounded-xl">
                    ⚡
                </div>
                <h1 class="text-lg font-bold tracking-wide text-white">Interview Prep</h1>
            </div>
            
            <div id="userInfo" class="hidden flex items-center gap-4">
                <span id="usernameDisplay" class="text-sm font-medium text-slate-300"></span>
                <button onclick="logout()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 py-1.5 px-3 rounded-lg transition">
                    Вийти
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto w-full px-6 py-8 flex-grow flex flex-col justify-center">

        <!-- 1. AUTH SECTION -->
        <section id="authSection" class="max-w-md mx-auto w-full bg-[#121824] p-8 rounded-2xl border border-slate-800/80 shadow-2xl">
            <h2 class="text-2xl font-bold mb-6 text-center text-white">Вхід в акаунт</h2>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Username</label>
                    <input type="text" id="loginUsername" required value="sasha" class="w-full p-3 bg-[#1a2232] border border-slate-700/60 rounded-xl focus:outline-none focus:border-indigo-500 text-white transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Password</label>
                    <input type="password" id="loginPassword" required value="mysecretpassword123" class="w-full p-3 bg-[#1a2232] border border-slate-700/60 rounded-xl focus:outline-none focus:border-indigo-500 text-white transition">
                </div>
                <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-semibold text-white transition shadow-lg shadow-indigo-600/20">
                    Увійти
                </button>
                <p id="loginError" class="text-red-400 text-sm text-center hidden mt-2"></p>
            </form>
        </section>

        <!-- 2. DASHBOARD SECTION -->
        <!-- 2. DASHBOARD SECTION -->
        <section id="dashboardSection" class="hidden space-y-6">
            
            <!-- Hero Banner з текстом та фоном -->
            <div class="relative overflow-hidden bg-gradient-to-r from-[#121824] via-[#1a2336] to-[#121824] p-8 md:p-10 rounded-2xl border border-slate-800/80 shadow-2xl text-center">
                <!-- Декоративні розмиті плями для ефекту свічення -->
                <div class="absolute -left-10 -top-10 w-40 h-40 bg-indigo-600/10 rounded-full blur-2xl pointer-events-none"></div>
                <div class="absolute -right-10 -bottom-10 w-40 h-40 bg-purple-600/10 rounded-full blur-2xl pointer-events-none"></div>

                <div class="relative z-10 max-w-2xl mx-auto space-y-2">
                    <h2 class="text-2xl md:text-3xl font-extrabold text-white tracking-tight">
                        Welcome to IT Interview Prep Hub
                    </h2>
                    <p class="text-sm md:text-base text-slate-400 font-medium">
                        Master your technical interviews with confidence
                    </p>
                </div>
            </div>

            <!-- Stats Widgets Grid -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <!-- Total -->
                <div class="bg-[#121824] p-5 rounded-2xl border border-slate-800/80 shadow-sm flex flex-col justify-between">
                    <div class="flex items-center gap-2 text-slate-400 text-xs font-medium">
                        <span>📖</span> Total Questions
                    </div>
                    <p id="statTotal" class="text-3xl font-extrabold text-white mt-3">0</p>
                </div>

                <!-- New -->
                <div class="bg-[#121824] p-5 rounded-2xl border border-slate-800/80 shadow-sm flex flex-col justify-between">
                    <div class="flex items-center gap-2 text-slate-400 text-xs font-medium">
                        <span class="text-indigo-400">✨</span> New
                    </div>
                    <p id="statNew" class="text-3xl font-extrabold text-white mt-3">0</p>
                </div>

                <!-- Learning -->
                <div class="bg-[#121824] p-5 rounded-2xl border border-slate-800/80 shadow-sm flex flex-col justify-between">
                    <div class="flex items-center gap-2 text-slate-400 text-xs font-medium">
                        <span class="text-amber-400">⚡</span> Learning
                    </div>
                    <p id="statLearning" class="text-3xl font-extrabold text-white mt-3">0</p>
                </div>

                <!-- Mastered -->
                <div class="bg-[#121824] p-5 rounded-2xl border border-slate-800/80 shadow-sm flex flex-col justify-between">
                    <div class="flex items-center gap-2 text-slate-400 text-xs font-medium">
                        <span class="text-emerald-400">✅</span> Mastered
                    </div>
                    <p id="statMastered" class="text-3xl font-extrabold text-white mt-3">0</p>
                </div>
            </div>

            <!-- Main Question Card -->
            <div class="bg-[#121824] p-8 md:p-10 rounded-2xl border border-slate-800/80 shadow-xl space-y-6">
                
                <!-- Tags -->
                <div class="flex items-center gap-2">
                    <span id="qCategory" class="bg-indigo-600/30 text-indigo-300 border border-indigo-500/30 px-3.5 py-1 rounded-full text-xs font-semibold">
                        System Design
                    </span>
                    <span id="qDifficulty" class="bg-amber-500/20 text-amber-300 border border-amber-500/30 px-3.5 py-1 rounded-full text-xs font-semibold">
                        Medium
                    </span>
                </div>

                <!-- Question Title -->
                <h3 id="qTitle" class="text-2xl md:text-3xl font-bold text-white leading-tight min-h-[60px]">
                    Завантаження питання...
                </h3>

                <!-- Toggle Answer Accordion -->
                <div class="pt-2">
                    <button onclick="toggleAnswer()" class="flex items-center gap-2 text-slate-400 hover:text-slate-200 text-sm font-medium transition focus:outline-none">
                        <span id="answerArrow" class="text-xs transition-transform">⌵</span> Answer
                    </button>

                    <div id="answerBox" class="hidden mt-3 p-5 bg-[#182030] rounded-xl border border-slate-800 text-slate-300 text-sm md:text-base leading-relaxed whitespace-pre-line">
                        <p id="qAnswer"></p>
                    </div>
                </div>

                <!-- Action Buttons Row -->
                <div class="flex flex-col sm:flex-row items-center gap-3 pt-6 border-t border-slate-800/60">
                    <button onclick="updateStatus('Learning')" class="w-full sm:w-auto flex-1 py-3 px-6 rounded-xl border border-amber-500/40 bg-amber-500/10 hover:bg-amber-500/20 text-amber-300 font-semibold text-sm transition">
                        Still Learning
                    </button>

                    <button onclick="updateStatus('Mastered')" class="w-full sm:w-auto flex-1 py-3 px-6 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-sm transition shadow-lg shadow-emerald-500/20">
                        Mastered
                    </button>

                    <button onclick="loadRandomQuestion()" class="w-full sm:w-auto py-3 px-6 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm transition flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/20">
                        Next Question <span class="text-base">→</span>
                    </button>
                </div>

            </div>
        </section>

    </main>

    <script src="app.js"></script>
</body>
</html>
